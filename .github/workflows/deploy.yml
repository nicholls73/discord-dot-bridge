name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require dynamic authorization runtime before Terraform
        run: npm run verify:production-runtime
      - name: Test and build Worker bundle
        run: npm run check
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
      - name: Validate deployment settings and write R2 backend configuration
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            const path = require("node:path");
            const required = [
              "TF_STATE_R2_ACCOUNT_ID", "TF_STATE_R2_BUCKET", "CLOUDFLARE_ACCOUNT_ID",
              "DISCORD_BOT_USER_ID", "ACCESS_OWNER_EMAIL", "WORKERS_DEV_SUBDOMAIN",
              "ACCESS_TEAM_DOMAIN", "ACCESS_IDENTITY_PROVIDER_ID"
            ];
            for (const name of required) {
              if (!process.env[name]?.trim()) throw new Error(`Required production variable ${name} is missing`);
            }
            const quote = JSON.stringify;
            const backend = [
              `bucket = ${quote(process.env.TF_STATE_R2_BUCKET)}`,
              `key = "discord-dot/production/terraform.tfstate"`,
              `region = "auto"`,
              `endpoints = { s3 = ${quote(`https://${process.env.TF_STATE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com`)} }`,
              `use_lockfile = true`, `use_path_style = true`,
              `skip_credentials_validation = true`, `skip_metadata_api_check = true`,
              `skip_region_validation = true`, `skip_requesting_account_id = true`,
              `skip_s3_checksum = true`
            ].join("\n") + "\n";
            writeFileSync(path.join(process.env.RUNNER_TEMP, "discord-dot-backend.hcl"), backend);
          '
        env:
          TF_STATE_R2_ACCOUNT_ID: ${{ vars.TF_STATE_R2_ACCOUNT_ID }}
          TF_STATE_R2_BUCKET: ${{ vars.TF_STATE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_BOT_USER_ID: ${{ vars.DISCORD_BOT_USER_ID }}
          ACCESS_OWNER_EMAIL: ${{ vars.ACCESS_OWNER_EMAIL }}
          WORKERS_DEV_SUBDOMAIN: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_IDENTITY_PROVIDER_ID: ${{ vars.ACCESS_IDENTITY_PROVIDER_ID }}
      - name: Apply production infrastructure
        run: |
          terraform -chdir=terraform init -input=false -backend-config="$RUNNER_TEMP/discord-dot-backend.hcl" -lockfile=readonly
          terraform -chdir=terraform apply -input=false -auto-approve -lock-timeout=5m
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_owner_email: ${{ vars.ACCESS_OWNER_EMAIL }}
          TF_VAR_workers_dev_subdomain: ${{ vars.WORKERS_DEV_SUBDOMAIN }}
          TF_VAR_access_team_domain: ${{ vars.ACCESS_TEAM_DOMAIN }}
          TF_VAR_access_identity_provider_id: ${{ vars.ACCESS_IDENTITY_PROVIDER_ID }}
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_discord_bot_user_id: ${{ vars.DISCORD_BOT_USER_ID }}
          TF_VAR_discord_oauth_client_secret: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          WRANGLER_WRITE_LOGS: "false"
