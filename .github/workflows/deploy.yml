name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ github.sha }}
          path: dist/index.js
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ github.sha }}
          path: dist/
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.0
          terraform_wrapper: false
      - name: Validate deployment settings and write R2 backend configuration
        run: |
          node -e '
            const { writeFileSync } = require("node:fs");
            const path = require("node:path");
            const required = [
              "TF_STATE_R2_ACCOUNT_ID", "TF_STATE_R2_BUCKET", "CLOUDFLARE_ACCOUNT_ID",
              "DISCORD_BOT_USER_ID", "ACCESS_OWNER_EMAIL", "WORKERS_DEV_SUBDOMAIN",
              "ACCESS_TEAM_DOMAIN", "ACCESS_IDENTITY_PROVIDER_ID"
            ];
            for (const name of required) {
              if (!process.env[name]?.trim()) throw new Error(`Required production variable ${name} is missing`);
            }
            const quote = JSON.stringify;
            const backend = [
              `bucket = ${quote(process.env.TF_STATE_R2_BUCKET)}`,
              `key = "discord-dot/production/terraform.tfstate"`,
              `region = "auto"`,
              `endpoints = { s3 = ${quote(`https://${process.env.TF_STATE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com`)} }`,
              `use_lockfile = true`, `use_path_style = true`,
              `skip_credentials_validation = true`, `skip_metadata_api_check = true`,
              `skip_region_validation = true`, `skip_requesting_account_id = true`,
              `skip_s3_checksum = true`
            ].join("\n") + "\n";
            writeFileSync(path.join(process.env.RUNNER_TEMP, "discord-dot-backend.hcl"), backend);
          '
        env:
          TF_STATE_R2_ACCOUNT_ID: ${{ secrets.TF_STATE_R2_ACCOUNT_ID || vars.TF_STATE_R2_ACCOUNT_ID }}
          TF_STATE_R2_BUCKET: ${{ secrets.TF_STATE_R2_BUCKET || vars.TF_STATE_R2_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_BOT_USER_ID: ${{ secrets.DISCORD_BOT_USER_ID || vars.DISCORD_BOT_USER_ID }}
          ACCESS_OWNER_EMAIL: ${{ secrets.ACCESS_OWNER_EMAIL || vars.ACCESS_OWNER_EMAIL }}
          WORKERS_DEV_SUBDOMAIN: ${{ secrets.WORKERS_DEV_SUBDOMAIN || vars.WORKERS_DEV_SUBDOMAIN }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN || vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_IDENTITY_PROVIDER_ID: ${{ secrets.ACCESS_IDENTITY_PROVIDER_ID || vars.ACCESS_IDENTITY_PROVIDER_ID }}
      - name: Apply the verified existing installation update
        run: |
          set -euo pipefail
          umask 077
          plan="$RUNNER_TEMP/discord-dot.tfplan"
          trap 'rm -f "$plan"' EXIT
          terraform -chdir=terraform init -input=false -backend-config="$RUNNER_TEMP/discord-dot-backend.hcl" -lockfile=readonly
          terraform -chdir=terraform plan -input=false -lock-timeout=5m -out="$plan" -no-color > "$RUNNER_TEMP/discord-dot-plan.log" 2>&1
          terraform -chdir=terraform show -json "$plan" | node .github/scripts/check-deployment-plan.ts
          terraform -chdir=terraform apply -input=false -lock-timeout=5m "$plan"
        env:
          TF_IN_AUTOMATION: 'true'
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID || vars.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_owner_email: ${{ secrets.ACCESS_OWNER_EMAIL || vars.ACCESS_OWNER_EMAIL }}
          TF_VAR_workers_dev_subdomain: ${{ secrets.WORKERS_DEV_SUBDOMAIN || vars.WORKERS_DEV_SUBDOMAIN }}
          TF_VAR_access_team_domain: ${{ secrets.ACCESS_TEAM_DOMAIN || vars.ACCESS_TEAM_DOMAIN }}
          TF_VAR_access_identity_provider_id: ${{ secrets.ACCESS_IDENTITY_PROVIDER_ID || vars.ACCESS_IDENTITY_PROVIDER_ID }}
          TF_VAR_discord_bot_token: ${{ secrets.DISCORD_BOT_TOKEN }}
          TF_VAR_discord_bot_user_id: ${{ secrets.DISCORD_BOT_USER_ID || vars.DISCORD_BOT_USER_ID }}
          TF_VAR_discord_oauth_client_secret: ${{ secrets.DISCORD_OAUTH_CLIENT_SECRET }}
          WRANGLER_WRITE_LOGS: "false"
