name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: prior-work
    attributes:
      label: Existing work
      options:
        - label: I searched existing issues and pull requests.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
